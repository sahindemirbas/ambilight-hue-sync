[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambilight-hue-sync"
version = "1.0.0"
description = "Stream a Philips TV's own Ambilight colours to Philips Hue lights over the Entertainment API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ambilight-hue-sync = "ambilight_hue_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
